name: ci

# CI runs on pull requests only, never on pushes to dev or main (the pull request already ran it).
# - A maintainer's own pull request runs on open and on every push.
# - Anyone else's pull request runs only when a maintainer approves it (approve again to re-run after new pushes),
#   so outside changes cannot spend Actions minutes on their own.
# - Actions > ci > Run workflow runs it by hand on any branch.
# Maintainers: the 'brockweaver' login in each job's 'if' below.
on:
  pull_request:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

# A newer run of the same kind for the same pull request cancels the older one (a new push cancels the previous push's
# run, a new approval the previous approval's); comment-only reviews never cancel an approved run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.review.state || 'none' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'brockweaver')
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.review.user.login == 'brockweaver')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      # SQLite tests run everywhere. SQL Server (2022) and PostgreSQL (18) database tests run where Docker is
      # available (ubuntu) and skip elsewhere; the jobs below cover the other versions.
      - run: dotnet test -c Release --no-build
      - run: dotnet run -c Release --no-build --project src/Badger.SqlMigrate.Cli -- plan check -C samples/demo-db

  # Every supported SQL Server version with a Linux container image: the provider's tests against each.
  sqlserver:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'brockweaver')
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.review.user.login == 'brockweaver')
    strategy:
      fail-fast: false
      matrix:
        version: ['2017', '2019', '2022', '2025']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Badger.SqlMigrate.Providers.SqlServer.Tests -c Release
        env:
          BSM_TEST_SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest

  # SQL Server 2016 SP1, the oldest supported version, has no Linux image: LocalDB on Windows.
  sqlserver-2016:
    name: sqlserver (2016 SP1 LocalDB)
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'brockweaver')
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.review.user.login == 'brockweaver')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install SQL Server 2016 SP1 Express LocalDB
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'SqlLocalDB2016.msi'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://download.microsoft.com/download/9/0/7/907AD35F-9F9C-43A5-9789-52470555DB90/ENU/SqlLocalDB.msi' -OutFile $msi
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($hash -ne '413E739B79068BA0D91A8C62DB14BCCD37591E86515F4AE74F4C91C270F02D45') { throw "unexpected SqlLocalDB.msi hash $hash" }
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/qn', '/norestart', 'IACCEPTSQLLOCALDBLICENSETERMS=YES' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "SqlLocalDB.msi exited with $($p.ExitCode)" }
          $sqllocaldb = 'C:\Program Files\Microsoft SQL Server\130\Tools\Binn\SqlLocalDB.exe'
          & $sqllocaldb versions
          & $sqllocaldb create bsm2016 13.0 -s
          if ($LASTEXITCODE -ne 0) { throw 'could not create the LocalDB 2016 instance' }
      - run: dotnet test tests/Badger.SqlMigrate.Providers.SqlServer.Tests -c Release
        env:
          BSM_TEST_SQLSERVER: Server=(localdb)\bsm2016;Integrated Security=true;TrustServerCertificate=true

  # Every supported PostgreSQL major version: the provider's conformance and feature tests against each.
  postgresql:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'brockweaver')
      || (github.event_name == 'pull_request_review' && github.event.review.state == 'approved' && github.event.review.user.login == 'brockweaver')
    strategy:
      fail-fast: false
      matrix:
        version: ['12', '13', '14', '15', '16', '17', '18']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Badger.SqlMigrate.Providers.PostgreSql.Tests -c Release
        env:
          BSM_TEST_POSTGRES_IMAGE: postgres:${{ matrix.version }}
