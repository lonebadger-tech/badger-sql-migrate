name: ci

# CI runs on pull requests only, never on pushes to dev or main (the pull request already ran it).
# - brockweaver's pull requests run on open and on every push.
# - Anyone else's run only after brockweaver approves them: the repository requires approval of workflow runs from
#   all external contributors (Settings > Actions > General), so each run waits for "Approve and run workflows".
#   Read the changes first, ci.yml included: an approved run uses the pull request's copy of this file.
# - dev and main require every job below to pass before a pull request can merge.
# - Actions > ci > Run workflow runs it by hand on any branch.
# Jobs deliberately have no 'if:' conditions: a skipped job counts as a passed required check.
on:
  pull_request:
  workflow_dispatch:

# A newer run for the same pull request cancels the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build -c Release
      # SQLite tests (bundled engine) run everywhere. SQL Server (2022) and PostgreSQL (18) database tests run where Docker is
      # available (ubuntu) and skip elsewhere; the jobs below cover the other versions.
      - run: dotnet test -c Release --no-build
      - run: dotnet run -c Release --no-build --project src/Badger.Trek.Cli -- plan check -C samples/demo-db

  # Every supported SQL Server version (2019 and later): the provider's tests against each.
  sqlserver:
    strategy:
      fail-fast: false
      matrix:
        version: ['2019', '2022', '2025']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Badger.Trek.Providers.SqlServer.Tests -c Release
        env:
          TREK_TEST_SQLSERVER_IMAGE: mcr.microsoft.com/mssql/server:${{ matrix.version }}-latest

  # The build jobs test SQLite with the engine trek ships. Other programs open the same files with the SQLite their
  # Linux distribution ships, back to 3.26 (RHEL 8, the oldest trek supports): the provider's tests against each of those.
  sqlite:
    name: sqlite (${{ matrix.version }}, ${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { version: '3.26.0', distro: 'AlmaLinux 8', image: 'almalinux:8', library: /usr/lib64/libsqlite3.so.0 }
          - { version: '3.34.1', distro: 'AlmaLinux 9', image: 'almalinux:9', library: /usr/lib64/libsqlite3.so.0 }
          - { version: '3.37.2', distro: 'Ubuntu 22.04', image: 'ubuntu:22.04', library: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 }
          - { version: '3.40.1', distro: 'Debian 12', image: 'debian:12', library: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 }
          - { version: '3.45.1', distro: 'Ubuntu 24.04', image: 'ubuntu:24.04', library: /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 }
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install the distribution's SQLite and what .NET needs
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y sqlite-libs libicu tar gzip findutils git
          else
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libsqlite3-0 libicu-dev ca-certificates curl git
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # TREK_TEST_SQLITE_VERSION makes the run fail if the tests did not get the distribution's library.
      - run: dotnet test tests/Badger.Trek.Providers.Sqlite.Tests -c Release
        env:
          TREK_SQLITE_LIBRARY: ${{ matrix.library }}
          TREK_TEST_SQLITE_VERSION: ${{ matrix.version }}
      # Without TREK_SQLITE_LIBRARY trek picks the engine itself: the built-in one, or the system's where the built-in one
      # cannot load (it needs glibc 2.33; AlmaLinux 8 has 2.28).
      - name: Test the engine trek picks on this distribution
        if: always()
        run: dotnet test tests/Badger.Trek.Providers.Sqlite.Tests -c Release --no-build

  # Every PostgreSQL major version still supported by the PostgreSQL project (5 years each): the provider's
  # conformance and feature tests against each.
  postgresql:
    strategy:
      fail-fast: false
      matrix:
        version: ['15', '16', '17', '18']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/Badger.Trek.Providers.PostgreSql.Tests -c Release
        env:
          TREK_TEST_POSTGRES_IMAGE: postgres:${{ matrix.version }}
