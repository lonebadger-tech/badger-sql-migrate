name: release

# Push a tag like v0.1.0 to build every platform's binaries, the .NET tool package and SHA256SUMS,
# publish the tool to nuget.org and attach the files to a GitHub release.
# The website's download links point at the Azure blob container: afterwards, build/mirror-release.sh copies
# this release's files there, so the site, nuget.org and GitHub serve the same build.
#
# nuget.org uses Trusted Publishing, not an API key: a policy on nuget.org trusts this repository's
# release.yml, and NuGet/login trades the job's GitHub OIDC token for a short-lived key.
# Needs the repository secret NUGET_USER: the nuget.org profile name (not email) that owns the policy.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release
      - run: build/publish.sh "${GITHUB_REF_NAME#v}"
      - name: Sign in to nuget.org (Trusted Publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --title "Badger SQL Migrate ${GITHUB_REF_NAME#v}" --notes "See https://lonebadger.tech/badger-sql-migrate/releases/"
